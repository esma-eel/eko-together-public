services:
  # ============================================================================
  # 1. PostgreSQL - User & Auth Service Database (Port 5432)
  # ============================================================================
  postgres_auth_db:
    image: postgres:16-alpine
    container_name: postgres_auth_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_AUTH_DB:-auth_db}
      POSTGRES_USER: ${POSTGRES_AUTH_USER:-auth_user}
      POSTGRES_PASSWORD: ${POSTGRES_AUTH_PASSWORD:-auth_password}
    ports:
      - "${POSTGRES_AUTH_PORT:-5432}:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_AUTH_USER:-auth_user} -d ${POSTGRES_AUTH_DB:-auth_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - discussion_forum_net

  # ============================================================================
  # 2. PostgreSQL - Forum Service Database (Port 5433)
  # ============================================================================
  postgres_forum_db:
    image: postgres:16-alpine
    container_name: postgres_forum_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_FORUM_DB:-forum_db}
      POSTGRES_USER: ${POSTGRES_FORUM_USER:-forum_user}
      POSTGRES_PASSWORD: ${POSTGRES_FORUM_PASSWORD:-forum_password}
    ports:
      - "${POSTGRES_FORUM_PORT:-5433}:5432"
    volumes:
      - postgres_forum_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_FORUM_USER:-forum_user} -d ${POSTGRES_FORUM_DB:-forum_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - discussion_forum_net

  # ============================================================================
  # 3. PostgreSQL - Dedicated Voting Service Database (Port 5434)
  # ============================================================================
  postgres_voting_db:
    image: postgres:16-alpine
    container_name: postgres_voting_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_VOTING_DB:-voting_db}
      POSTGRES_USER: ${POSTGRES_VOTING_USER:-voting_user}
      POSTGRES_PASSWORD: ${POSTGRES_VOTING_PASSWORD:-voting_password}
    ports:
      - "${POSTGRES_VOTING_PORT:-5434}:5432"
    volumes:
      - postgres_voting_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_VOTING_USER:-voting_user} -d ${POSTGRES_VOTING_DB:-voting_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - discussion_forum_net

  # ============================================================================
  # 4. MongoDB - Post & Comment Service NoSQL Store (Port 27017)
  # ============================================================================
  mongodb_cluster:
    image: mongo:7.0
    container_name: mongodb_cluster
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-mongo_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-mongo_password}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-posts_comments_db}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand(\"ping\").ok' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - discussion_forum_net

  # ============================================================================
  # 5. Redis - Caching & Fast CQRS Read Engine (Port 6379)
  # ============================================================================
  redis_cache:
    image: redis:7.2-alpine
    container_name: redis_cache
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - discussion_forum_net

  # ============================================================================
  # 6. RabbitMQ - Asynchronous Event Bus & Anti-Spike Buffer (Ports 5672, 15672)
  # ============================================================================
  rabbitmq_broker:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq_broker
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-rabbit_user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-rabbit_password}
    ports:
      - "${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - discussion_forum_net

  # ============================================================================
  # 7. Elasticsearch - Full-Text & Multi-Entity Search (Port 9200)
  # ============================================================================
  elasticsearch:
    image: elasticsearch:8.13.4
    container_name: elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q 'status' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s
    networks:
      - discussion_forum_net

  # ============================================================================
  # 8. MinIO - Local S3 Object Storage Simulation (Ports 9000, 9001)
  # ============================================================================
  minio_storage:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: minio_storage
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_password}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - discussion_forum_net

  # ============================================================================
  # 9. API Gateway - Reverse Proxy & Central Route Dispatcher (Port 80)
  # ============================================================================
  api_gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: api_gateway
    restart: unless-stopped
    environment:
      - GATEWAY_ORIGIN_SECRET=${GATEWAY_ORIGIN_SECRET:-eko-gateway}
    ports:
      - "${GATEWAY_PORT:-80}:80"
    volumes:
      - ./gateway/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
      - ./gateway/static:/usr/share/nginx/html:ro
    depends_on:
      - redis_cache
      - rabbitmq_broker
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health | grep -q 'healthy' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "auth_user_service:host-gateway"
      - "forum_service:host-gateway"
      - "media_service:host-gateway"
      - "post_comment_service:host-gateway"
      - "voting_service:host-gateway"
      - "feed_service:host-gateway"
      - "search_service:host-gateway"
    networks:
      - discussion_forum_net

networks:
  discussion_forum_net:
    driver: bridge

volumes:
  postgres_auth_data:
  postgres_forum_data:
  postgres_voting_data:
  mongodb_data:
  redis_data:
  rabbitmq_data:
  elasticsearch_data:
  minio_data:
